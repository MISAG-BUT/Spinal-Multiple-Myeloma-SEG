[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spinal-multiple-myeloma-seg"
version = "0.1.0"
description = "Tools and scripts for Spinal-Multiple-Myeloma-SEG"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "MISAG-BUT"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.10.0+cu130",
    "torchvision==0.25.0+cu130",
    "numpy==2.3.5",
    "nibabel==5.3.3",
    "SimpleITK==2.5.3",
    "scipy==1.17.0",
    "batchgenerators==0.25.1",
    "batchgeneratorsv2==0.3.0",
    "acvl-utils==0.2.5",
    "dynamic-network-architectures==0.4.3",
    "nnunetv2 @ git+https://github.com/MIC-DKFZ/nnUNet.git@273d6147f2d71bafc27a5e1c6fcab9f59ceba7d0",
    "pydicom==3.0.2",
]

[project.optional-dependencies]
gui = ["napari[all]==0.6.6"]

[project.scripts]
spinal-db-viewer = "spinal_mm_cli:database_viewer"
spinal-run-nnunet-TCIA = "spinal_mm_cli:run_prediction_tcia"
spinal-run-nnunet-new-prediction = "spinal_mm_cli:run_prediction_new"
spinal-run-nnunet-benchmark-prediction = "run_prediction_of_nnUNet_benchmark_models:cli"

[tool.setuptools]
packages = ["utils", "utils.benchmark"]
py-modules = [
    "run_prediction_of_nnUNet_benchmark_models",
    "Database_viewer_final",
    "run_prediction_of_nnUNet_networks_on_TCIA_data_final",
    "run_prediction_of_nnUNet_networks_on_new_data",
    "spinal_mm_cli",
    "config",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
