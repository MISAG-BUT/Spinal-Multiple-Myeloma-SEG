[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spinal-multiple-myeloma-seg"
version = "0.1.0"
description = "Tools and scripts for Spinal-Multiple-Myeloma-SEG"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "MISAG-BUT"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.8"
dependencies = [
    "nibabel",
    "numpy",
    "torch",
    "torchvision",
    "pydicom",
    "napari[all]",
    "SimpleITK",
]

[project.scripts]
spinal-db-viewer = "spinal_mm_cli:database_viewer"
spinal-run-nnunet-TCIA = "spinal_mm_cli:run_prediction_tcia"
spinal-run-nnunet-new-prediction = "spinal_mm_cli:run_prediction_new"
spinal-run-nnunet-benchmark-prediction = "run_prediction_of_nnUNet_benchmark_models:cli"

[tool.setuptools]
py-modules = [
    "benchmark_lesion_inference",
    "benchmark_spine_inference",
    "benchmark_model_installation",
    "benchmark_nifti",
    "benchmark_model_registry",
    "run_prediction_of_nnUNet_benchmark_models",
    "Database_viewer_final",
    "run_prediction_of_nnUNet_networks_on_TCIA_data_final",
    "run_prediction_of_nnUNet_networks_on_new_data",
    "utils",
    "spinal_mm_cli",
    "config",
]
